<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - XpressRides</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS conectado -->
    <link rel="stylesheet" href="/css/estilos.css">

    <style>
        body {
            background-color: var(--color-page-bg, #F8F9FB);
            font-family: var(--font-family-base);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Estilo para el nuevo logo */
        .brand-logo-img {
            max-width: 260px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<main class="main-container" style="max-width: 600px;">

    <!-- Logo XpressRides (Imagen) -->
    <div class="text-center mb-24">
        <img src="/img/logo.png" alt="XpressRides Logo" class="brand-logo-img">
    </div>

    <!-- Tarjeta Blanca Moderna -->
    <section class="premium-card">

        <h2 class="premium-title" style="margin-bottom: 5px;">Panel de Administración</h2>
        <p class="premium-subtitle">Evaluación y Habilitación de Choferes</p>

        <!-- Mensajes de Alerta -->
        <div class="alert-success" id="eval-success" style="display: none; font-size: 13px; text-align: center;">
            ¡Chofer evaluado y habilitado exitosamente!
        </div>
        <div class="alert-error" id="eval-error" style="display: none; font-size: 13px; text-align: center;">
            Las notas no alcanzan el mínimo requerido para habilitar.
        </div>

        <!-- Formulario de Evaluación -->
        <form id="evaluation-form">

            <div class="mb-24">
                <label for="choferPostulante" class="premium-label">Seleccionar Postulante</label>
                <select id="choferPostulante" class="premium-input" required>
                    <option value="" disabled selected>Postulantes registrados</option>
                </select>
            </div>

            <div class="mb-24">
                <label for="notaPsicologica" class="premium-label">Prueba Psicológica (Mín. 73)</label>
                <input type="number" id="notaPsicologica" class="premium-input" placeholder="Ingresar nota del 0 al 100" min="0" max="100" required>
            </div>

            <div class="mb-24">
                <label for="notaVehicular" class="premium-label">Revisión Vehicular (Mín. 65)</label>
                <input type="number" id="notaVehicular" class="premium-input" placeholder="Ingresar nota del 0 al 100" min="0" max="100" required>
            </div>

            <button type="submit" class="premium-btn" id="btn-evaluar">Registrar Calificaciones</button>

        </form>
    </section>

</main>

<!-- Integración con Backend -->
<script src="/js/api.js"></script>
<script src="/js/admin-dashboard.js"></script>

</body>
</html>
